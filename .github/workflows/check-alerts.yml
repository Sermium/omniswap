name: Check price alerts

# Vercel's Hobby plan caps cron at once per day, which is far too infrequent for
# price alerts - so the schedule lives here instead (Actions is free on this
# public repo) and just pokes the protected API route.
#
# NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# Don't let a slow run overlap the next scheduled one.
concurrency:
  group: check-alerts
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger alert check
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # "Not configured yet" is not a failure - warn and stop, rather than
          # turning setup-pending into a red X on every 10-minute run.
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL variable or CRON_SECRET secret is not set - alert checks are not running yet."
            exit 0
          fi

          code=$(curl -sS --max-time 60 -o /tmp/body -w '%{http_code}' -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "$APP_URL/api/cron/check-alerts") || {
              echo "::error::Could not reach $APP_URL/api/cron/check-alerts"
              exit 1
            }

          echo "HTTP $code"
          cat /tmp/body; echo

          case "$code" in
            2*)
              exit 0 ;;
            503)
              # The app itself reports it isn't configured (CRON_SECRET missing
              # on the deployment). Same "pending setup" case as above.
              echo "::warning::App reports CRON_SECRET is not configured on the deployment yet."
              exit 0 ;;
            401)
              echo "::error::Rejected by the app - the CRON_SECRET here does not match the one deployed."
              exit 1 ;;
            *)
              echo "::error::Alert check failed with HTTP $code"
              exit 1 ;;
          esac

      # A silently dead alert cron hides every alert behind it, so a genuine
      # failure (not the pending-setup cases above, which exit 0) gets pushed
      # to Telegram rather than only living in the Actions tab.
      - name: Notify Telegram if the alert cron broke
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram not configured - skipping notification."
            exit 0
          fi

          text="⚠️ OmniSwap price-alert cron FAILED
          Price alerts are not being checked.
          ${RUN_URL}"

          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${text}" \
            -o /dev/null -w 'telegram HTTP %{http_code}\n'
